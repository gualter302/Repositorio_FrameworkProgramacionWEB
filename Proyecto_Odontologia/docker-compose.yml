services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sigodental
      POSTGRES_USER: sigodental
      POSTGRES_PASSWORD: desarrollo_local
    ports: ["5432:5432"]
    volumes:
      - sigo_postgres:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigodental -d sigodental"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    environment:
      PORT: 10000
      DATABASE_URL: postgresql://sigodental:desarrollo_local@postgres:5432/sigodental
      JWT_SECRET: desarrollo-docker-jwt-con-mas-de-32-caracteres
      MFA_SECRET: desarrollo-docker-mfa-seguro
      MFA_DEMO_CODE: "123456"
      CONSENT_OTP: "654321"
      STATIC_DIR: /app/static
    ports: ["3000:10000"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  sigo_postgres:

